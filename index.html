<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorpresa Fotos San Valentín</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="encabezado-container">
    <div id="brillo">¡Feliz Día de San Valentín! 💞</div>
  </div>

  <div class="galeria">
    <div class="carta" onclick="voltearCarta(this)">
      <div class="cara frente">
        <img src="img/foto1.jpeg" alt="Foto 1">
      </div>
      <div class="cara atras">
        <p>💕 Eres mi persona favorita para compartir un picnic y un beso💕</p>
      </div>

    </div>

    <div class="carta" onclick="voltearCarta(this)">
      <div class="cara frente">
        <img src="img/foto2.jpeg" alt="Foto 2">
      </div>
      <div class="cara atras">
        <p>😂 Contigo me río más que con los memes 😂</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
